name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run simulation tests
        run: npm test
